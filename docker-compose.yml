services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: socialops
      POSTGRES_USER: socialops
      POSTGRES_PASSWORD: socialops
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialops -d socialops"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - socialops_pgdata:/var/lib/postgresql/data

volumes:
  socialops_pgdata:
